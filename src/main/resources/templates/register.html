<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记账系统 - 注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .register-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .register-left {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .register-left h1 {
            font-size: 42px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .register-left p {
            font-size: 18px;
            opacity: 0.9;
            text-align: center;
            line-height: 1.6;
        }

        .register-left .benefits {
            margin-top: 40px;
        }

        .register-left .benefit-item {
            display: flex;
            align-items: center;
            margin: 15px 0;
            font-size: 16px;
        }

        .register-left .benefit-item::before {
            content: "✓";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            margin-right: 12px;
            font-size: 12px;
        }

        .register-right {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-right h2 {
            font-size: 32px;
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        .register-right .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        @media (max-width: 768px) {
            .register-container {
                flex-direction: column;
                margin: 20px;
            }

            .register-left {
                padding: 40px 20px;
            }

            .register-left h1 {
                font-size: 32px;
            }

            .register-right {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-left">
            <h1>开启智能记账</h1>
            <p>加入我们，轻松管理您的财务</p>
            <div class="benefits">
                <div class="benefit-item">免费注册，立即使用</div>
                <div class="benefit-item">账单导入，省时省力</div>
                <div class="benefit-item">智能分类，自动统计</div>
                <div class="benefit-item">数据安全，隐私保护</div>
            </div>
        </div>
        <div class="register-right">
            <h2>创建账户</h2>
            <p class="subtitle">填写以下信息完成注册</p>

            <div th:if="${error}" class="alert alert-error" th:text="${error}">
                用户名已存在
            </div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
                    <p class="hint">用户名用于登录，长度3-20个字符</p>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                    <p class="hint">密码至少6个字符</p>
                </div>

                <div class="form-group">
                    <label for="email">邮箱（选填）</label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱">
                    <p class="hint">用于找回密码和接收通知</p>
                </div>

                <button type="submit" class="btn-register">注 册</button>
            </form>

            <div class="login-link">
                已有账户？ <a th:href="@{/login}">立即登录</a>
            </div>
        </div>
    </div>
</body>
</html>
