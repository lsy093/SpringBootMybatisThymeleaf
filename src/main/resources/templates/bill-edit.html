<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑账单 - 记账系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
        }
        
        .card-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .card-header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .card-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #666;
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        
        .nav-bar {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .nav-bar a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin: 0 15px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .nav-bar a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .category-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .category-option {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            color: #666;
        }
        
        .category-option:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .category-option.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/home">返回首页</a>
            <a href="/bill/list">账单列表</a>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h1>编辑账单</h1>
                <p>修改账单信息</p>
            </div>
            
            <form method="post" action="/bill/edit">
                <input type="hidden" name="id" th:value="${bill.id}">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>交易日期</label>
                        <input type="datetime-local" name="transactionDate" 
                               th:value="${#temporals.format(bill.transactionDate, 'yyyy-MM-dd'T'HH:mm')}" required>
                    </div>
                    <div class="form-group">
                        <label>金额</label>
                        <input type="number" step="0.01" name="amount" th:value="${bill.amount}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>账单类型</label>
                    <select name="billType" required>
                        <option value="INCOME" th:selected="${bill.billType == 'INCOME'}">收入</option>
                        <option value="EXPENSE" th:selected="${bill.billType == 'EXPENSE'}">支出</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>分类</label>
                    <div class="category-options">
                        <div class="category-option" th:class="${bill.category == '餐饮' ? 'active' : ''}" 
                             onclick="document.getElementById('category').value='餐饮'">餐饮</div>
                        <div class="category-option" th:class="${bill.category == '交通' ? 'active' : ''}" 
                             onclick="document.getElementById('category').value='交通'">交通</div>
                        <div class="category-option" th:class="${bill.category == '购物' ? 'active' : ''}" 
                             onclick="document.getElementById('category').value='购物'">购物</div>
                        <div class="category-option" th:class="${bill.category == '通讯' ? 'active' : ''}" 
                             onclick="document.getElementById('category').value='通讯'">通讯</div>
                        <div class="category-option" th:class="${bill.category == '娱乐' ? 'active' : ''}" 
                             onclick="document.getElementById('category').value='娱乐'">娱乐</div>
                        <div class="category-option" th:class="${bill.category == '医疗' ? 'active' : ''}" 
                             onclick="document.getElementById('category').value='医疗'">医疗</div>
                        <div class="category-option" th:class="${bill.category == '教育' ? 'active' : ''}" 
                             onclick="document.getElementById('category').value='教育'">教育</div>
                        <div class="category-option" th:class="${bill.category == '工资' ? 'active' : ''}" 
                             onclick="document.getElementById('category').value='工资'">工资</div>
                        <div class="category-option" th:class="${bill.category == '其他支出' || bill.category == '其他收入' ? 'active' : ''}" 
                             onclick="document.getElementById('category').value='其他'">其他</div>
                    </div>
                    <input type="hidden" id="category" name="category" th:value="${bill.category}">
                </div>
                
                <div class="form-group">
                    <label>交易类型</label>
                    <input type="text" name="transactionType" th:value="${bill.transactionType}">
                </div>
                
                <div class="form-group">
                    <label>备注</label>
                    <textarea name="remark" th:text="${bill.remark}"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">保存修改</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='/bill/list'">取消</button>
            </form>
        </div>
    </div>
</body>
</html>
